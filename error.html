
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,follow">
<meta name="description" content="Halaman yang kamu cari tidak ditemukan.">
<title>404 — Halaman Tidak Ditemukan</title>
<style>
*{box-sizing:border-box}
html{min-height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#252830;display:flex;align-items:center;justify-content:center;padding:28px 18px}
main{width:100%;max-width:480px;text-align:center}
.code{margin:0;font-size:clamp(76px,20vw,120px);font-weight:800;line-height:1;letter-spacing:-5px;color:#252830}
h1{font-size:clamp(22px,5vw,29px);line-height:1.3;margin:16px 0 24px;font-weight:750}
.illustration{display:block;width:100%;max-width:245px;height:auto;margin:0 auto 25px}
.message{font-size:16px;line-height:1.8;color:#626873;margin:0 auto 27px;max-width:340px}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.btn{display:inline-block;min-width:145px;padding:13px 19px;border:1px solid #2874d0;border-radius:9px;background:#2874d0;color:#fff;font-size:15px;font-weight:700;text-decoration:none;text-align:center;cursor:pointer;font-family:inherit}
.btn.secondary{background:#fff;color:#2874d0;border-color:#d9e1eb}
.btn:focus-visible{outline:3px solid #9bc6ff;outline-offset:3px}
.btn:active{opacity:.8}
footer{margin-top:32px;color:#9aa0aa;font-size:12px}
@media(max-width:360px){body{padding:22px 14px}.code{letter-spacing:-3px}.message{font-size:14px}.btn{min-width:130px;padding:12px 14px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<main>
<p class="code">404</p>
<h1>Halaman Tidak Ditemukan</h1>

<ellipse cx="125" cy="200" rx="91" ry="9" fill="#e8eaed"/>
<path d="M68 25 Q68 15 80 15 H155 L196 55 V174 Q196 185 184 185 H80 Q68 185 68 173Z" fill="#f5f6f8" stroke="#555a63" stroke-width="5" stroke-linejoin="round"/>
<path d="M155 17 V47 Q155 55 164 55 H194" fill="#dfe2e7" stroke="#555a63" stroke-width="5" stroke-linejoin="round"/>
<circle cx="103" cy="105" r="5.5" fill="#30343b"/>
<circle cx="158" cy="105" r="5.5" fill="#30343b"/>
<path d="M109 135 Q130 117 151 135" fill="none" stroke="#30343b" stroke-width="5" stroke-linecap="round"/>
<path d="M68 133 L48 157 M196 133 L212 155" fill="none" stroke="#555a63" stroke-width="6" stroke-linecap="round"/>

<circle cx="214" cy="158" r="8" fill="#555a63"/>
<path d="M100 184 L94 199 M162 184 L170 199" fill="none" stroke="#555a63" stroke-width="8" stroke-linecap="round"/>
<path d="M195 36 Q205 12 225 22 Q241 32 231 49 L216 64 L204 50Z" fill="#e8edf4"/>
<path d="M218 34 Q218 29 224 29 Q231 29 230 35 Q230 39 224 42 V45 M224 51 V52" fill="none" stroke="#555a63" stroke-width="4" stroke-linecap="round"/>

<p class="message">Maaf, halaman yang kamu cari tidak dapat ditemukan atau sudah dipindahkan.</p>

<div class="actions">
<a class="btn" href="/">Kembali ke Beranda</a>
<button class="btn secondary" id="backBtn" type="button">Halaman Sebelumnya</button>
</div>

<footer>404 · Halaman tidak tersedia</footer>
</main>
<script>
(function(){
var btn=document.getElementById("backBtn");
btn.onclick=function(){
if(window.history.length>1){
window.history.back();
}else{
window.location.href="/";
}
};
})();
</script>
</body>
</html>
