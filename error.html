<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0f16" />
    <meta name="robots" content="noindex,follow" />
    <meta
      name="description"
      content="Halaman yang kamu cari tidak ditemukan."
    />
    <title>404 — Halaman Tidak Ditemukan</title>
    <style>
      :root{
        color-scheme:dark;
        --bg:#0b0f16;
        --green:#20df88;
        --green2:#6aefad;
        --text:#f2f5f8;
        --muted:#929eaf;
        --border:#283343;
      }
      *{box-sizing:border-box}
      html{min-height:100%;-webkit-text-size-adjust:100%}
      body{
        margin:0;
        min-height:100vh;
        min-height:100dvh;
        background:var(--bg);
        color:var(--text);
        font-family:Arial,Helvetica,sans-serif;
        overflow-x:hidden;
        display:flex;
        flex-direction:column;
        position:relative;
      }
      body:before{
        content:"";
        position:fixed;
        inset:0;
        pointer-events:none;
        z-index:-1;
        background:
          radial-gradient(ellipse at 50% 35%,rgba(32,223,136,.065),transparent 42%),
          linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
          linear-gradient(90deg,rgba(255,255,255,.012) 1px,transparent 1px);
        background-size:auto,32px 32px,32px 32px;
      }
      a{color:inherit}
      button{font:inherit}
      .topbar{
        width:100%;
        min-height:76px;
        padding:16px 20px;
        display:flex;
        align-items:center;
        justify-content:center;
      }
      .brand{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        text-decoration:none;
        font-size:19px;
        font-weight:800;
        letter-spacing:-.6px;
        white-space:nowrap;
      }
      .brand-icon{
        width:32px;
        height:32px;
        display:grid;
        place-items:center;
        color:var(--green);
        flex-shrink:0;
      }
      .brand-icon svg{width:32px;height:32px}
      .brand-name span{color:var(--green)}
      main{
        width:100%;
        flex:1;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:18px 20px 42px;
      }
      .content{
        width:100%;
        max-width:760px;
        text-align:center;
      }
      .scene{
        width:100%;
        max-width:460px;
        height:auto;
        display:block;
        margin:0 auto -2px;
      }
      .code{
        margin:0;
        font-size:clamp(88px,17vw,150px);
        line-height:.95;
        font-weight:900;
        letter-spacing:-9px;
        color:var(--green);
        text-shadow:0 10px 45px rgba(32,223,136,.10);
      }
      h1{
        margin:23px 0 0;
        font-size:clamp(23px,4.5vw,38px);
        line-height:1.25;
        letter-spacing:-1px;
        font-weight:800;
      }
      h1 span{color:var(--green)}
      .message{
        max-width:490px;
        margin:20px auto 0;
        color:var(--muted);
        font-size:16px;
        line-height:1.8;
      }
      .actions{
        margin-top:36px;
        display:flex;
        flex-wrap:wrap;
        justify-content:center;
        gap:13px;
      }
      .btn{
        min-height:52px;
        padding:0 23px;
        border-radius:10px;
        display:inline-flex;
        justify-content:center;
        align-items:center;
        gap:12px;
        font-size:14px;
        font-weight:700;
        text-decoration:none;
        cursor:pointer;
        transition:background .15s,border-color .15s;
      }
      .btn svg{width:19px;height:19px;flex-shrink:0}
      .btn:active{opacity:.8}
      .btn-home{
        background:var(--green);
        border:1px solid var(--green);
        color:#07170f;
      }
      .btn-home:hover{background:var(--green2)}
      .btn-back{
        background:transparent;
        border:1px solid #455267;
        color:var(--text);
      }
      .btn-back:hover{
        border-color:var(--green);
        background:rgba(32,223,136,.04);
      }
      .btn:focus-visible{
        outline:2px solid var(--green);
        outline-offset:3px;
      }
      .footer{
        width:min(620px,calc(100% - 40px));
        margin:0 auto;
        padding:25px 0 28px;
        border-top:1px solid var(--border);
        text-align:center;
        color:var(--muted);
        font-size:13px;
        line-height:1.8;
      }
      .footer strong{color:#b6c0cf;font-weight:700}
      .footer .dot{display:inline-block;padding:0 13px;color:#526073}
      .ground{
        position:fixed;
        z-index:-1;
        pointer-events:none;
        bottom:-95px;
        width:350px;
        height:190px;
        border:1px solid rgba(32,223,136,.35);
        border-radius:50% 50% 0 0;
        background:linear-gradient(160deg,rgba(32,223,136,.07),transparent);
      }
      .ground.left{left:-180px;transform:rotate(15deg)}
      .ground.right{right:-180px;transform:rotate(-15deg)}
      @media(max-width:650px){
        .topbar{min-height:68px;padding:14px 16px}
        .brand{font-size:16px;gap:8px}
        .brand-icon,.brand-icon svg{width:28px;height:28px}
        main{padding:18px 17px 32px}
        .scene{max-width:350px}
        .code{letter-spacing:-6px}
        h1{margin-top:20px}
        .message{font-size:14px;line-height:1.8;margin-top:15px}
        .actions{margin-top:27px;gap:10px}
        .btn{min-height:47px;padding:0 15px;font-size:13px}
        .footer{font-size:11px;padding:21px 0 24px}
        .footer .dot{padding:0 7px}
      }
      @media(max-width:380px){
        .brand{font-size:14px;gap:7px}
        .brand-icon,.brand-icon svg{width:25px;height:25px}
        main{padding:15px 14px 25px}
        .scene{max-width:300px}
        .code{font-size:86px;letter-spacing:-4px}
        h1{font-size:22px}
        .message{font-size:13px}
        .actions{
          flex-direction:column;
          align-items:stretch;
          max-width:280px;
          margin:25px auto 0;
        }
        .btn{width:100%}
      }
      @media(prefers-reduced-motion:reduce){
        *,*:before,*:after{transition:none!important}
      }
    </style>
  </head>
