<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <meta name="theme-color" content="#08090d" />
    <meta
      name="description"
      content="Text Maker dengan berbagai efek TextPro."
    />
    <title>Text Maker</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon-180x180.png">
    <link rel="icon" type="image/png" sizes="192x192"  href="/favicons/android-icon-192x192.png">
    <meta name="msapplication-TileColor" content="#ffffff">
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{background:#08090d}
      body{
        min-height:100vh;
        background:#08090d;
        color:#f5f5f7;
        font-family:Arial,Helvetica,sans-serif;
        font-size:14px;
        padding:14px
      }
      button,input{font:inherit}
      .app{max-width:900px;margin:auto}
      .header{
        padding:18px 16px;
        border:1px solid #24262d;
        border-radius:18px;
        background:#0e1015;
        margin-bottom:12px
      }
      .header h1{
        font-size:23px;
        letter-spacing:-.5px
      }
      .header p{
        margin-top:5px;
        color:#8f949f;
        font-size:12px
      }
      .panel{
        border:1px solid #24262d;
        background:#0e1015;
        border-radius:18px;
        padding:14px;
        margin-bottom:12px
      }
      .label{
        display:block;
        font-size:11px;
        font-weight:700;
        color:#aeb3bd;
        text-transform:uppercase;
        letter-spacing:.8px;
        margin-bottom:8px
      }
      .modes{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        margin-bottom:13px
      }
      .mode{
        border:1px solid #292c34;
        background:#14161c;
        color:#aeb3bd;
        border-radius:12px;
        padding:11px;
        font-weight:700;
        cursor:pointer
      }
      .mode.active{
        background:#f5f5f7;
        color:#08090d;
        border-color:#f5f5f7
      }
      .input{
        width:100%;
        height:46px;
        border:1px solid #292c34;
        background:#090a0e;
        color:#fff;
        border-radius:12px;
        padding:0 13px;
        outline:none;
        margin-bottom:8px
      }
      .input:focus{border-color:#777d89}
      .input.limit{
        border-color:#fff
      }
      .hidden{display:none}
      .input-wrap{
        position:relative
      }
      .counter{
        position:absolute;
        right:12px;
        top:15px;
        font-size:10px;
        color:#777d89;
        pointer-events:none
      }
      .counter.limit{
        color:#fff;
        font-weight:700
      }
      .generate{
        width:100%;
        height:47px;
        border:0;
        border-radius:13px;
        background:#fff;
        color:#08090d;
        font-weight:800;
        cursor:pointer
      }
      .generate:disabled{opacity:.5}
      .status{
        display:none;
        padding:10px 12px;
        border-radius:11px;
        background:#15171d;
        color:#aeb3bd;
        font-size:12px;
        margin-top:9px;
        text-align:center
      }
      .status.show{display:block}
      .categories{
        display:flex;
        gap:7px;
        overflow-x:auto;
        padding-bottom:4px;
        scrollbar-width:none
      }
      .categories::-webkit-scrollbar{display:none}
      .category{
        flex:0 0 auto;
        border:1px solid #292c34;
        background:#14161c;
        color:#aeb3bd;
        padding:9px 12px;
        border-radius:10px;
        font-size:12px;
        font-weight:700;
        cursor:pointer
      }
      .category.active{
        background:#fff;
        color:#08090d;
        border-color:#fff
      }
      .styles{
        display:grid;
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:9px;
        margin-top:12px
      }
      .style{
        border:1px solid #292c34;
        background:#111319;
        border-radius:14px;
        overflow:hidden;
        cursor:pointer;
        text-align:left;
        color:#fff;
        padding:0
      }
      .style.active{
        border-color:#fff;
        box-shadow:0 0 0 1px #fff
      }
      .thumb{
        position:relative;
        width:100%;
        aspect-ratio:1.7/1;
        background:#181a20;
        overflow:hidden
      }
      .thumb img{
        width:100%;
        height:100%;
        display:block;
        object-fit:cover
      }
      .thumb.noimg:after{
        content:"Preview tidak tersedia";
        position:absolute;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:11px;
        color:#737985
      }
      .style-name{
        display:block;
        padding:10px;
        font-size:12px;
        font-weight:700;
        line-height:1.35;
        min-height:50px
      }
      .style-badge{
        display:block;
        padding:0 10px 10px;
        font-size:10px;
        font-weight:700;
        color:#8f949f
      }
      .selected{
        font-size:11px;
        color:#777d89;
        margin-top:10px;
        line-height:1.4
      }
      .result{display:none}
      .result.show{display:block}
      .result img{
        display:block;
        width:100%;
        max-width:650px;
        margin:10px auto 0;
        border-radius:13px;
        border:1px solid #292c34;
        background:#08090d
      }
      .result-actions{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        margin-top:10px
      }
      .action{
        height:44px;
        border-radius:11px;
        border:1px solid #292c34;
        background:#15171d;
        color:#fff;
        font-weight:700;
        cursor:pointer
      }
      .action.download{
        background:#fff;
        color:#08090d;
        border-color:#fff
      }
      .action:disabled{opacity:.5}
      @media(min-width:650px){
        .styles{grid-template-columns:repeat(4,minmax(0,1fr))}
        body{padding:22px}
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="header">
        <h1>Text Maker</h1>
        <p>Generate text effect dengan koleksi style menarik.</p>
      </div>
      <div class="panel">
        <span class="label">Mode teks</span>
        <div class="modes">
          <button class="mode active" data-mode="1">1 TEKS</button>
          <button class="mode" data-mode="2">2 TEKS</button>
        </div>
        <div class="input-wrap">
          <input
            id="text1"
            class="input"
            type="text"
            maxlength="15"
            placeholder="Masukkan teks"
          />
          <span id="counter1" class="counter">0/15</span>
        </div>
        <div class="input-wrap hidden" id="text2Wrap">
          <input
            id="text2"
            class="input"
            type="text"
            maxlength="15"
            placeholder="Masukkan teks"
          />
          <span id="counter2" class="counter">0/15</span>
        </div>
        <button id="generate" class="generate">BUAT TEXT EFFECT</button>
        <div id="status" class="status"></div>
      </div>
      <div class="panel">
        <span class="label">Kategori Style</span>
        <div id="categories" class="categories"></div>
        <div id="styles" class="styles"></div>
        <div id="selected" class="selected"></div>
      </div>
      <div id="resultBox" class="panel result">
        <span class="label">Hasil</span>
        <img id="resultImage" alt="Hasil Text Maker" />
        <div class="result-actions">
          <button id="download" class="action download">DOWNLOAD</button>
          <button id="newResult" class="action">BUAT LAGI</button>
        </div>
      </div>
    </div>
