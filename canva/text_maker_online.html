      name="description"
      content="Text Maker dengan berbagai efek TextPro."

    <title>Text Maker</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      html{background:#08090d}
      body{
      min-height:100vh;
      background:#08090d;
      color:#f5f5f7;
      font-family:Arial,Helvetica,sans-serif;
      font-size:14px;
      padding:14px
      }
      button,input{font:inherit}
      .app{max-width:900px;margin:auto}
      .header{
      padding:18px 16px;
      border:1px solid #24262d;
      border-radius:18px;
      background:#0e1015;
      margin-bottom:12px
      }
      .header h1{
      font-size:23px;
      letter-spacing:-.5px
      }
      .header p{
      margin-top:5px;
      color:#8f949f;
      font-size:12px
      }
      .panel{
      border:1px solid #24262d;
      background:#0e1015;
      border-radius:18px;
      padding:14px;
      margin-bottom:12px
      }
      .label{
      display:block;
      font-size:11px;
      font-weight:700;
      color:#aeb3bd;
      text-transform:uppercase;
      letter-spacing:.8px;
      margin-bottom:8px
      }
      .modes{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-bottom:13px
      }
      .mode{
      border:1px solid #292c34;
      background:#14161c;
      color:#aeb3bd;
      border-radius:12px;
      padding:11px;
      font-weight:700;
      cursor:pointer
      }
      .mode.active{
      background:#f5f5f7;
      color:#08090d;
      border-color:#f5f5f7
      }
      .input{
      width:100%;
      height:46px;
      border:1px solid #292c34;
      background:#090a0e;
      color:#fff;
      border-radius:12px;
      padding:0 13px;
      outline:none;
      margin-bottom:8px
      }
      .input:focus{border-color:#777d89}
      .hidden{display:none}
      .generate{
      width:100%;
      height:47px;
      border:0;
      border-radius:13px;
      background:#fff;
      color:#08090d;
      font-weight:800;
      cursor:pointer
      }
      .generate:disabled{opacity:.5}
      .status{
      display:none;
      padding:10px 12px;
      border-radius:11px;
      background:#15171d;
      color:#aeb3bd;
      font-size:12px;
      margin-top:9px;
      text-align:center
      }
      .status.show{display:block}
      .categories{
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding-bottom:4px;
      scrollbar-width:none
      }
      .categories::-webkit-scrollbar{display:none}
      .category{
      flex:0 0 auto;
      border:1px solid #292c34;
      background:#14161c;
      color:#aeb3bd;
      padding:9px 12px;
      border-radius:10px;
      font-size:12px;
      font-weight:700;
      cursor:pointer
      }
      .category.active{
      background:#fff;
      color:#08090d;
      border-color:#fff
      }
      .styles{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
      margin-top:12px
      }
      .style{
      border:1px solid #292c34;
      background:#111319;
      border-radius:14px;
      overflow:hidden;
      cursor:pointer;
      text-align:left;
      color:#fff;
      padding:0
      }
      .style.active{
      border-color:#fff;
      box-shadow:0 0 0 1px #fff
      }
      .thumb{
      position:relative;
      width:100%;
      aspect-ratio:1.7/1;
      background:#181a20;
      overflow:hidden
      }
      .thumb img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover
      }
      .thumb.noimg:after{
      content:"Preview tidak tersedia";
      position:absolute;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      color:#737985
      }
      .style-name{
      display:block;
      padding:10px;
      font-size:12px;
      font-weight:700;
      line-height:1.35;
      min-height:50px
      }
      .style-badge{
      display:block;
      padding:0 10px 10px;
      font-size:10px;
      font-weight:700;
      color:#8f949f
      }
      .selected{
      font-size:11px;
      color:#777d89;
      margin-top:10px;
      line-height:1.4
      }
      .result{
      display:none
      }
      .result.show{display:block}
      .result img{
      display:block;
      width:100%;
      max-width:650px;
      margin:10px auto 0;
      border-radius:13px;
      border:1px solid #292c34;
      background:#08090d
      }
      .result-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px
      }
      .action{
      height:44px;
      border-radius:11px;
      border:1px solid #292c34;
      background:#15171d;
      color:#fff;
      font-weight:700;
      cursor:pointer
      }
      .action.download{
      background:#fff;
      color:#08090d;
      border-color:#fff
      }
      .action:disabled{opacity:.5}
      @media(min-width:650px){
      .styles{grid-template-columns:repeat(4,minmax(0,1fr))}
      body{padding:22px}
      }
    </style>
  </head>

      setMode(1);
      }
      }

      function renderCategories(){
      categoriesBox.innerHTML="";

      const fragment=document.createDocumentFragment();

      categories.forEach(function(category,index){
      const button=document.createElement("button");

      button.className=
      "category"+
      (index===categoryIndex?" active":"");

      button.textContent=category.name;
      button.type="button";

      button.onclick=function(){
      categoryIndex=index;
      styleIndex=0;

      renderCategories();
      renderStyles();
      };

      fragment.appendChild(button);
      });

      categoriesBox.appendChild(fragment);
      }

      function renderStyles(){
      const category=categories[categoryIndex];

      stylesBox.innerHTML="";

      const fragment=document.createDocumentFragment();

      category.items.forEach(function(item,index){
      const button=document.createElement("button");

      button.type="button";

      button.className=
      "style"+
      (index===styleIndex?" active":"");

      const thumb=document.createElement("div");
      thumb.className="thumb";

      const img=document.createElement("img");

      img.loading="lazy";
      img.decoding="async";
      img.alt=prettyName(item[0]);
      img.src=fullURL(item[1]);

      img.onerror=function(){
      thumb.classList.add("noimg");
      img.style.display="none";
      };

      thumb.appendChild(img);

      const title=document.createElement("span");

      title.className="style-name";
      title.textContent=prettyName(item[0]);

      button.appendChild(thumb);
      button.appendChild(title);

      if(isTwoTextStyle(item[0])){
      const badge=document.createElement("small");

      badge.className="style-badge";
      badge.textContent="2 TEKS";

      button.appendChild(badge);
      }

      button.onclick=function(){
      styleIndex=index;

      renderStyles();

      updateStyleMode(item[0]);
      };

      fragment.appendChild(button);
      });

      stylesBox.appendChild(fragment);

      const selected=category.items[styleIndex];

      selectedBox.textContent=
      "Style dipilih: "+
      prettyName(selected[0]);

      if(isTwoTextStyle(selected[0])){
      selectedBox.textContent+=
      " • Membutuhkan 2 teks";
      }
      }

      modes.forEach(function(button){
      button.onclick=function(){
      const requestedMode=
      Number(button.dataset.mode);

      const item=
      categories[categoryIndex].items[styleIndex];

      if(
      requestedMode===1&&
      isTwoTextStyle(item[0])
      ){
      showStatus(
      "Style ini khusus 2 teks."
      );
      return;
      }

      setMode(requestedMode);
      };
      });

      generate.onclick=async function(){
      const first=text1.value.trim();
      const second=text2.value.trim();

      const item=
      categories[categoryIndex].items[styleIndex];

      const twoTextRequired=
      isTwoTextStyle(item[0]);

      if(!first){
      alert("Masukkan teks terlebih dahulu.");
      text1.focus();
      return;
      }

      if(twoTextRequired&&!second){
      setMode(2);

      showStatus(
      "Masukkan teks kedua terlebih dahulu."
      );

      text2.focus();
      return;
      }

      if(!twoTextRequired&&mode===1&&second){
      text2.value="";
      }

      if(mode===2&&!second){
      showStatus(
      "Mode 2 TEKS membutuhkan dua teks."
      );

      text2.focus();
      return;
      }

      const selectedStyle=
      fullURL(item[0]);

      const textArray=
      twoTextRequired||mode===2
      ?[first,second]
      :[first];

      const params=
      new URLSearchParams();

      params.set(
      "path",
      "maker/text/effect"
      );

      params.set(
      "style_url",
      selectedStyle
      );

      params.set(
      "text",
      JSON.stringify(textArray)
      );

      generate.disabled=true;
      generate.textContent="MEMBUAT...";

      showStatus(
      twoTextRequired
      ?"Sedang membuat dengan 2 teks..."
      :"Sedang membuat text effect..."
      );

      try{
      const response=await fetch(
      API_BASE+"?"+params.toString(),
      {
      method:"GET",
      cache:"no-store"
      }
      );

      if(!response.ok){
      throw new Error(
      "HTTP "+response.status
      );
      }

      const json=
      await response.json();

      if(
      !json||
      json.status!==true||
      !json.data
      ){
      throw new Error(
      json&&json.message
      ?json.message
      :"API gagal membuat gambar"
      );
      }

      resultURL=
      json.data.url_file||
      json.data.url||
      "";

      if(!resultURL){
      throw new Error(
      "URL hasil tidak ditemukan"
      );
      }

      resultImage.src=resultURL;

      resultBox.classList.add("show");

      resultBox.scrollIntoView({
      behavior:"smooth",
      block:"start"
      });

      showStatus(
      "Berhasil membuat text effect."
      );

      }catch(error){
      console.error(error);

      showStatus(
      "Gagal membuat text effect."
      );

      alert(
      "Gagal membuat text effect. Coba lagi."
      );

      }finally{
      generate.disabled=false;
      generate.textContent=
      "BUAT TEXT EFFECT";
      }
      };

      download.onclick=async function(){
      if(!resultURL)return;

      download.disabled=true;
      download.textContent="MENGUNDUH...";

      try{
      const params=
      new URLSearchParams();

      params.set(
      "path",
      "download"
      );

      params.set(
      "url",
      resultURL
      );

      const response=
      await fetch(
      API_BASE+"?"+params.toString(),
      {
      method:"GET",
      cache:"no-store"
      }
      );

      if(!response.ok){
      throw new Error(
      "Download gagal"
      );
      }

      const blob=
      await response.blob();

      if(!blob.size){
      throw new Error(
      "File kosong"
      );
      }

      const blobURL=
      URL.createObjectURL(blob);

      const link=
      document.createElement("a");

      const type=
      blob.type||"image/jpeg";

      let ext="jpg";

      if(type.includes("png")){
      ext="png";
      }else if(type.includes("webp")){
      ext="webp";
      }else if(type.includes("gif")){
      ext="gif";
      }

      link.href=blobURL;

      link.download=
      "text-maker-"+Date.now()+"."+ext;

      document.body.appendChild(link);

      link.click();

      link.remove();

      setTimeout(function(){
      URL.revokeObjectURL(blobURL);
      },2000);

      }catch(error){
      console.error(error);

      alert(
      "Gagal mengunduh gambar."
      );

      }finally{
      download.disabled=false;
      download.textContent=
      "DOWNLOAD";
      }
      };

      newResult.onclick=function(){
      resultBox.classList.remove("show");

      resultImage.removeAttribute("src");

      resultURL="";

      window.scrollTo({
      top:0,
      behavior:"smooth"
      });
      };

      renderCategories();
      renderStyles();
    </script>
  </body>
</html>
