<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Cari dan lihat video TikTok dengan cepat."
    />
    <title>TikTok Explorer — DIMMZZZSUM_ENAK</title>

    <style>
      *{
        box-sizing:border-box;
        margin:0;
        padding:0;
      }

      html{
        scroll-behavior:smooth;
      }

      body{
        background:#f5f5f7;
        color:#17171a;
        font-family:Arial,Helvetica,sans-serif;
        min-height:100vh;
      }

      button,input{
        font:inherit;
      }

      .container{
        width:min(820px,calc(100% - 28px));
        margin:auto;
      }

      .header{
        padding:30px 0 18px;
      }

      .brand{
        display:flex;
        align-items:center;
        justify-content:space-between;
      }

      .brand-left{
        display:flex;
        align-items:center;
        gap:11px;
      }

      .logo{
        width:42px;
        height:42px;
        border-radius:13px;
        background:#111;
        color:#fff;
        display:grid;
        place-items:center;
        font-size:21px;
        font-weight:bold;
      }

      .brand h1{
        font-size:20px;
        letter-spacing:-.5px;
      }

      .brand p{
        color:#85858c;
        font-size:12px;
        margin-top:3px;
      }

      .badge{
        background:#fff;
        border:1px solid #e5e5e8;
        color:#66666d;
        border-radius:20px;
        padding:7px 10px;
        font-size:10px;
      }

      .search{
        margin-top:22px;
        background:#fff;
        border:1px solid #e3e3e7;
        border-radius:15px;
        padding:5px;
        display:flex;
        box-shadow:0 5px 18px rgba(0,0,0,.04);
      }

      .search input{
        flex:1;
        min-width:0;
        height:43px;
        padding:0 12px;
        border:0;
        outline:0;
        background:transparent;
        color:#111;
        font-size:14px;
      }

      .search input::placeholder{
        color:#a0a0a7;
      }

      .search button{
        border:0;
        border-radius:11px;
        padding:0 18px;
        background:#111;
        color:#fff;
        cursor:pointer;
        font-weight:bold;
        font-size:13px;
      }

      .search button:active{
        transform:scale(.97);
      }

      .search button:disabled{
        opacity:.5;
      }

      .tags{
        display:flex;
        gap:7px;
        overflow-x:auto;
        padding:10px 1px 1px;
        scrollbar-width:none;
      }

      .tags::-webkit-scrollbar{
        display:none;
      }

      .tag{
        flex:0 0 auto;
        border:1px solid #dedee3;
        background:#fff;
        color:#66666e;
        border-radius:20px;
        padding:8px 12px;
        font-size:11px;
        cursor:pointer;
      }

      .tag:active{
        background:#eeeef1;
      }

      .status{
        min-height:22px;
        color:#88888f;
        font-size:12px;
        padding:12px 2px 5px;
      }

      .results{
        display:grid;
        gap:15px;
        padding:5px 0 40px;
      }

      .empty{
        background:#fff;
        border:1px solid #e5e5e8;
        border-radius:17px;
        padding:55px 20px;
        text-align:center;
        color:#88888f;
        font-size:13px;
      }

      .empty-icon{
        width:48px;
        height:48px;
        border-radius:50%;
        background:#f0f0f2;
        display:grid;
        place-items:center;
        margin:0 auto 12px;
        font-size:21px;
        color:#555;
      }

      .card{
        background:#fff;
        border:1px solid #e4e4e7;
        border-radius:17px;
        overflow:hidden;
        box-shadow:0 5px 20px rgba(0,0,0,.045);
        animation:show .28s ease both;
      }

      @keyframes show{
        from{
          opacity:0;
          transform:translateY(8px);
        }
        to{
          opacity:1;
          transform:translateY(0);
        }
      }

      .media{
        position:relative;
        background:#101010;
        aspect-ratio:16/10;
        overflow:hidden;
      }

      .media video{
        width:100%;
        height:100%;
        display:block;
        object-fit:cover;
      }

      .cover{
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        object-fit:cover;
        pointer-events:none;
        transition:.2s;
        z-index:2;
      }

      .media.playing .cover{
        opacity:0;
      }

      .duration{
        position:absolute;
        right:10px;
        bottom:10px;
        padding:5px 7px;
        background:rgba(0,0,0,.7);
        color:#fff;
        border-radius:7px;
        font-size:10px;
        pointer-events:none;
        z-index:4;
      }

      .details{
        padding:14px;
      }

      .creator{
        display:flex;
        align-items:center;
        gap:9px;
      }

      .avatar{
        width:34px;
        height:34px;
        border-radius:50%;
        background:#eeeeef;
        display:grid;
        place-items:center;
        font-size:13px;
        font-weight:bold;
        color:#555;
        flex:0 0 34px;
      }

      .creator-name{
        font-size:13px;
        font-weight:bold;
        color:#17171a;
        overflow:hidden;
        white-space:nowrap;
        text-overflow:ellipsis;
      }

      .creator-label{
        color:#99999f;
        font-size:10px;
        margin-top:2px;
      }

      .description{
        color:#5f5f67;
        font-size:12px;
        line-height:1.55;
        margin-top:11px;
        display:-webkit-box;
        -webkit-line-clamp:3;
        -webkit-box-orient:vertical;
        overflow:hidden;
      }

      .stats{
        display:flex;
        gap:6px;
        flex-wrap:wrap;
        margin-top:11px;
      }

      .stat{
        padding:6px 8px;
        border-radius:8px;
        background:#f5f5f6;
        color:#77777f;
        font-size:10px;
      }

      .actions{
        display:flex;
        gap:8px;
        margin-top:13px;
      }

      .action{
        min-height:39px;
        flex:1;
        border-radius:10px;
        border:1px solid #dedee2;
        display:flex;
        align-items:center;
        justify-content:center;
        text-decoration:none;
        font-size:11px;
        font-weight:bold;
        cursor:pointer;
      }

      .watch{
        color:#222;
        background:#fff;
      }

      .download{
        background:#111;
        border-color:#111;
        color:#fff;
      }

      .action:active{
        transform:scale(.97);
      }

      .note{
        text-align:center;
        color:#aaaab0;
        font-size:10px;
        padding:0 0 24px;
      }

      .loading{
        display:inline-flex;
        align-items:center;
        gap:8px;
      }

      .spinner{
        width:15px;
        height:15px;
        border:2px solid #ddd;
        border-top-color:#111;
        border-radius:50%;
        animation:spin .65s linear infinite;
      }

      @keyframes spin{
        to{
          transform:rotate(360deg);
        }
      }

      .error{
        background:#fff;
        border:1px solid #ead5d5;
        color:#a25c5c;
        border-radius:15px;
        padding:17px;
        font-size:12px;
        line-height:1.5;
      }

      @media(max-width:500px){

        .container{
          width:calc(100% - 18px);
        }

        .header{
          padding-top:22px;
        }

        .badge{
          display:none;
        }

        .brand h1{
          font-size:18px;
        }

        .search button{
          padding:0 15px;
        }

        .media{
          aspect-ratio:9/12;
          max-height:510px;
        }

        .media video,
        .cover{
          object-fit:cover;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <header class="header">
        <div class="brand">
          <div class="brand-left">
            <div class="logo">♪</div>

            <div>
              <h1>TikTok Explorer</h1>
              <p>Cari, tonton, dan download video TikTok favoritmu dalam satu klik.</p>
            </div>
          </div>

          <div class="badge">VIDEO SEARCH</div>
        </div>

        <form class="search" id="searchForm">
          <input
            id="query"
            type="search"
            placeholder="Mau cari apa?"
            autocomplete="off"
            maxlength="100"
          />

          <button id="searchButton" type="submit">Cari</button>
        </form>

        <div class="tags">
          <button class="tag" data-query="viral">Viral</button>

          <button class="tag" data-query="funny">Funny</button>

          <button class="tag" data-query="gaming">Gaming</button>

          <button class="tag" data-query="food">Food</button>

          <button class="tag" data-query="music">Music</button>

          <button class="tag" data-query="tutorial">Tutorial</button>
        </div>
      </header>

      <div class="status" id="status"></div>

      <main class="results" id="results">
        <div class="empty">
          <div class="empty-icon">⌕</div>

          <div>
            Cari di atas, hasilnya bakal muncul di sini dan siap di download.`
          </div>
        </div>
      </main>

      <div class="note">© 2026 TikTok Explorer · <span id="footerText"></span></div>
    </div>
