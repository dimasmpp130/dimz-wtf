
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b12">
  <meta name="description" content="DIMZ Safelink Resolver - Resolve dan periksa tautan Safelink dengan mudah.">
  <title>DIMZ Safelink Resolver</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b12;
      --panel: #14141f;
      --border: #2b293b;
      --accent: #a78bfa;
      --text: #f5f3ff;
      --muted: #aaa6be;
      --green: #65e6a6;
      --red: #ff828c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 15px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(ellipse at 50% 0%, #30224d 0%, transparent 48%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
    }

    .app {
      width: 100%;
      max-width: 570px;
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 23px;
      background: rgba(20, 20, 31, .97);
      box-shadow: 0 24px 80px #0005;
    }

    .header {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo {
      width: 65px;
      height: 65px;
      display: grid;
      place-items: center;
      margin: auto;
      border: 1px solid #58467b;
      border-radius: 20px;
      background: #28203c;
      color: var(--accent);
      font-size: 32px;
      font-weight: 800;
    }

    h1 {
      margin: 14px 0 5px;
      font-size: clamp(22px, 5vw, 29px);
      letter-spacing: -.8px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .field { margin-top: 19px; }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      min-height: 49px;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
      background: #0c0c15;
      color: var(--text);
      font: inherit;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px #a78bfa18;
    }

    button {
      min-height: 46px;
      padding: 11px 15px;
      border: 0;
      border-radius: 11px;
      background: var(--accent);
      color: #171020;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
      transition: opacity .2s, transform .2s;
    }

    button:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: wait; }

    #resolve {
      width: 100%;
      margin-top: 22px;
    }

    .secondary {
      border: 1px solid var(--border);
      background: #242235;
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 13px;
    }

    .actions button { flex: 1; }

    .status {
      display: none;
      margin-top: 17px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0c0c15;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .status.show { display: block; }
    .status.success { color: var(--green); }
    .status.error { color: var(--red); }

    .result {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border: 1px solid #51416e;
      border-radius: 14px;
      background: #171323;
    }

    .result.show { display: block; }

    .result-url {
      display: block;
      color: var(--accent);
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.7;
    }

    .result-label {
      margin-bottom: 8px;
      color: var(--green);
      font-weight: 750;
    }

    .footer {
      margin-top: 25px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 7px;
      border: 2px solid #17102055;
      border-top-color: #171020;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: -2px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 420px) {
      .app { padding: 20px 16px; }
      .actions { flex-direction: column; }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div class="logo" aria-hidden="true">D↗</div>
      <h1>DIMZ Safelink Resolver</h1>
      <p class="subtitle">Resolve your links in one place.</p>
    </header>

    <form id="resolverForm">
      <div class="field">
        <label for="urlInput">Masukkan URL</label>
        <input
          id="urlInput"
          type="url"
          placeholder="https://sfl.gl/xxxxx"
          autocomplete="url"
          maxlength="2048"
          required
        >
      </div>

      <div class="field">
        <label for="serviceSelect">Pilih resolver</label>
        <select id="serviceSelect">
          <option value="auto">Auto Detect</option>
          <option value="mediafire">MediaFire</option>
          <option value="sub2unlock">Sub2Unlock</option>
          <option value="rekonise">Rekonise</option>
          <option value="safelinku">Safelinku</option>
          <option value="unshorten">Unshorten URL</option>
        </select>
      </div>

      <button id="resolveButton" type="submit">↗ Resolve URL</button>
    </form>

    <div id="status" class="status" role="status" aria-live="polite"></div>

    <section id="result" class="result" aria-label="Hasil resolver">
      <div class="result-label">✓ URL hasil resolver</div>
      <a
        id="resultUrl"
        class="result-url"
        href="#"
        target="_blank"
        rel="noopener noreferrer"
      ></a>

      <div class="actions">
        <button id="copyButton" class="secondary" type="button">
          Salin URL
        </button>
        <button id="openButton" type="button">
          Buka Hasil ↗
        </button>
      </div>
    </section>

    <footer class="footer">
      DIMMZZZSUM_ENAK · Safelink Resolver<br>
      Gunakan hanya pada tautan yang boleh kamu akses.
    </footer>
  </main>

  <script>
    "use strict";

    const form = document.getElementById("resolverForm");
    const urlInput = document.getElementById("urlInput");
    const serviceSelect = document.getElementById("serviceSelect");
    const resolveButton = document.getElementById("resolveButton");
    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");
    const resultUrl = document.getElementById("resultUrl");
    const copyButton = document.getElementById("copyButton");
    const openButton = document.getElementById("openButton");

    let currentResult = "";

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = "status show " + type;
    }

    function clearResult() {
      currentResult = "";
      resultUrl.textContent = "";
      resultUrl.removeAttribute("href");
      resultBox.classList.remove("show");
    }

    function isValidHttpUrl(value) {
      try {
        const url = new URL(value);

        if (!["http:", "https:"].includes(url.protocol)) return false;
        if (!url.hostname || url.username || url.password) return false;

        return true;
      } catch {
        return false;
      }
    }

    function detectService(url) {
      const host = new URL(url).hostname.toLowerCase();

      if (host === "mediafire.com" || host.endsWith(".mediafire.com")) {
        return "mediafire";
      }

      if (host === "sub2unlock.io" || host.endsWith(".sub2unlock.io")) {
        return "sub2unlock";
      }

      if (host === "rekonise.com" || host.endsWith(".rekonise.com")) {
        return "rekonise";
      }

      if (
        host === "sfl.gl" ||
        host.endsWith(".sfl.gl") ||
        host.includes("safelinku")
      ) {
        return "safelinku";
      }

      return "unshorten";
    }

    async function resolveLink(url, service) {
      const response = await fetch("https://dimz-wtf.web.id/api/safelink-sc", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        credentials: "same-origin",
        cache: "no-store",
        body: JSON.stringify({ url, service }),
        signal: AbortSignal.timeout(60000)
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          "Respons API bukan JSON. Pastikan /api/resolve sudah terpasang di Vercel."
        );
      }

      if (!response.ok || data.status !== true || !data.result?.url) {
        throw new Error(
          data.message || "Resolver gagal memproses tautan."
        );
      }

      if (!isValidHttpUrl(data.result.url)) {
        throw new Error("API mengembalikan URL hasil yang tidak valid.");
      }

      return data.result.url;
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      clearResult();

      const url = urlInput.value.trim();

      if (!isValidHttpUrl(url)) {
        setStatus("Masukkan URL HTTP atau HTTPS yang valid.", "error");
        return;
      }

      const service = serviceSelect.value === "auto"
        ? detectService(url)
        : serviceSelect.value;

      resolveButton.disabled = true;
      resolveButton.innerHTML =
        '<span class="spinner"></span>Memproses...';

      setStatus(
        "Menghubungi resolver " + service + ". Mohon tunggu..."
      );

      try {
        const destination = await resolveLink(url, service);

        currentResult = destination;
        resultUrl.href = destination;
        resultUrl.textContent = destination;
        resultBox.classList.add("show");

        setStatus(
          "Berhasil! Periksa URL hasil sebelum membukanya.",
          "success"
        );
      } catch (error) {
        setStatus(
          error.name === "TimeoutError"
            ? "Waktu proses habis. Silakan coba kembali."
            : error.message || "Terjadi kesalahan saat resolve.",
          "error"
        );
      } finally {
        resolveButton.disabled = false;
        resolveButton.textContent = "↗ Resolve URL";
      }
    });

    copyButton.addEventListener("click", async () => {
      if (!currentResult) return;

      try {
        await navigator.clipboard.writeText(currentResult);
        setStatus("URL berhasil disalin!", "success");
      } catch {
        setStatus(
          "Gagal menyalin otomatis. Tekan lama URL untuk menyalinnya.",
          "error"
        );
      }
    });

    openButton.addEventListener("click", () => {
      if (!isValidHttpUrl(currentResult)) return;

      window.open(
        currentResult,
        "_blank",
        "noopener,noreferrer"
      );
    });
  </script>
</body>
</html>
